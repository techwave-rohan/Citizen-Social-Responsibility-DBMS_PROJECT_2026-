<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustScore - Analyst Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar injected by api.js -->
    
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">Analyst Overview</h1>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-4 mb-8">
            <div class="card stat-card">
                <span class="value" id="stat-total-citizens">...</span>
                <span class="label">Total Citizens</span>
            </div>
            <div class="card stat-card">
                <span class="value" id="stat-national-avg">...</span>
                <span class="label">National Avg Score</span>
            </div>
            <div class="card stat-card">
                <span class="value" id="stat-total-complaints">...</span>
                <span class="label">Total Complaints</span>
            </div>
            <div class="card stat-card">
                <span class="value" id="stat-total-restrictions">...</span>
                <span class="label">Total Restrictions</span>
            </div>
        </div>

        <div class="grid grid-cols-2 mb-8">
            <!-- Avg Score by City -->
            <div class="card">
                <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Average Score by City</h2>
                <div style="width: 100%; overflow-x: auto;">
                    <canvas id="chart-city-scores" width="600" height="300"></canvas>
                </div>
            </div>

            <!-- Score Trend Over Time -->
            <div class="card">
                <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Score Trend (30 Days)</h2>
                <div style="width: 100%; overflow-x: auto;">
                    <canvas id="chart-score-trend" width="600" height="300"></canvas>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 mb-8">
            <!-- Violation Distribution Pie -->
            <div class="card">
                <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Violation Distribution</h2>
                <div style="display: flex; align-items: center; justify-content: space-around;">
                    <canvas id="chart-violations-pie" width="300" height="300"></canvas>
                    <div id="violations-legend" style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;">
                        <!-- Legend inserted here -->
                    </div>
                </div>
            </div>

            <!-- Complaints by City -->
            <div class="card">
                <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Complaints by City</h2>
                 <div class="table-container">
                    <table style="min-width: 100%;">
                        <thead>
                            <tr>
                                <th>City</th>
                                <th>Reported Cases</th>
                            </tr>
                        </thead>
                        <tbody id="complaints-city-body">
                            <!-- Rows inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Top 10 Citizens -->
        <div class="card">
            <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Top 10 Citizens (National)</h2>
            <div class="table-container">
                <table style="min-width: 100%;">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Citizen Name/ID</th>
                            <th>City</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="top-citizens-body">
                        <!-- Rows inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/analyst.js"></script>
</body>
</html>
