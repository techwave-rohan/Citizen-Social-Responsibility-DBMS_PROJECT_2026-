<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustScore - My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar injected by profile.js -->
    
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">My Profile</h1>
            <p class="text-muted">Manage your personal information and settings</p>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 100px; height: 100px; border-radius: 50%; background-color: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 600; margin: 0 auto 1rem;">
                    <span id="profile-initials">U</span>
                </div>
                <h2 id="profile-name" style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem;">Loading...</h2>
                <span id="profile-role-badge" class="badge">Role</span>
            </div>

            <div id="profile-details-container" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Profile details injected dynamically here -->
            </div>
            
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
